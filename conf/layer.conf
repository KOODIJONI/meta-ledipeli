
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ledipeli"
BBFILE_PATTERN_meta-ledipeli = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ledipeli = "6"

# This layer depends on meta-raspberrypi and openembedded-core layers
LAYERDEPENDS_meta-ledipeli = "core raspberrypi"
LAYERSERIES_COMPAT_meta-ledipeli = "scarthgap"
