worker_processes 1;
events { worker_connections 64; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80 default_server;
        root   /www;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
